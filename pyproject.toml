[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "iptda"
version = "0.1.0"
description = "Aprender Análisis Topológico de Datos (TDA) de forma gráfica e interactiva"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "PySide6>=6.5",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "gudhi>=3.8"]

[project.gui-scripts]
iptda = "iptda.app:main"

[tool.setuptools.packages.find]
include = ["iptda*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
