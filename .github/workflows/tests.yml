name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Bibliotecas del sistema para Qt (sin pantalla)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pyflakes

      - name: Análisis estático (pyflakes)
        run: python -m pyflakes iptda tests

      - name: Tests
        run: python -m pytest -q
